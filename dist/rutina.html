<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSFIT | Rutina Personalizada</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body, select, input, button, textarea {
      font-family: serif;
    }
    .bloque::before { content: "🏋️"; margin-right: 8px; }
    .invalid-campo {
      border-color: #f87171; /* rojo Tailwind */
      box-shadow: 0 0 0 2px rgba(248,113,113,0.5);
    }
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(6px);
      }
    }
    .bouncing-dot {
      animation: bounce 1.5s infinite;
    }
    .animate-bounce {
      animation: bounce 1.5s infinite;
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
</head>
<body class="bg-white text-black dark:bg-black dark:text-white">
<!-- <script>
  // Si NO está logueado, redirige a index.html
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  if (!isLoggedIn) {
    window.location.href = '/dist/index.html';
  }
</script> -->
  <!-- NAV -->
  <nav class="w-full bg-transparent text-white px-6 py-4 absolute top-0 left-0 z-10 flex items-center justify-center" data-aos="fade-down">
    <!-- Logo alineado a la izquierda -->
    <div class="absolute left-6 text-2xl tracking-wider font-black uppercase" style="color: transparent; -webkit-text-stroke: 1px white;">
      GSFIT
    </div>
    <!-- Menú centrado -->
    <ul class="flex space-x-6 mx-auto">
      <li>
        <a href="/dist/index.html" class="transition duration-300 ease-in-out hover:text-blue-400 hover:scale-110 text-center">Inicio</a>
      </li>
      <li>
        <a href="contacto.html" class="transition duration-300 ease-in-out hover:text-blue-400 hover:scale-110 text-center">Contacto</a>
      </li>
    </ul>
  </nav>

  <!-- Hero con video -->
  <div class="relative w-full h-screen overflow-hidden bg-white z-0">
    <video autoplay muted loop playsinline class="absolute w-full h-full object-cover">
      <source src="/videos/1.MOV" type="video/mp4">
      Tu navegador no soporta el video HTML5.
    </video>
    <div class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center text-center z-20 transition-all duration-700 ease-in-out">
      <h1 class="text-white text-4xl md:text-6xl font-bold uppercase" data-aos="fade-in">
        Crea tu rutina personalizada
      </h1>
      <p class="text-gray-300 text-sm mt-2">Elige tus ejercicios y agrúpalos por días</p>
    </div>
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-30">
      <div class="w-6 h-10 border-2 border-white rounded-full flex items-start justify-center">
        <div class="w-1 h-1 bg-white rounded-full mb-1 bouncing-dot"></div>
      </div>
    </div>
  </div>

  <div class="relative z-10 px-4 bg-white dark:bg-black">
    <main class="max-w-3xl mx-auto bg-white dark:bg-black p-6 rounded-xl shadow-lg space-y-6 pb-24">
<h2 class="text-2xl uppercase text-center" data-aos="fade-up">Crea tu propio bloque de entrenamiento</h2>
    <!-- Formulario de bloque -->
    <form id="formRutina" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-black p-8 rounded-xl shadow-xl transition-all duration-300" data-aos="fade-up">

      <!-- Información básica -->
      <div class="col-span-full">
        <h3 class="text-lg font-bold mb-2 border-b border-gray-300 dark:border-gray-700 pb-1">Información básica</h3>
      </div>

      <div class="relative col-span-full">
        <select id="dia" name="dia" required title="Selecciona el día de la semana"
          class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent text-black text-opacity-90 dark:text-white dark:text-opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none transition">
          <option value="" disabled selected hidden>Selecciona el día</option>
          <option>Lunes</option><option>Martes</option><option>Miércoles</option>
          <option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>

      <div class="relative col-span-full">
        <select id="ejercicio" name="ejercicio" required title="Selecciona un ejercicio"
          class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent text-black text-opacity-90 dark:text-white dark:text-opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none transition">
          <option value="" disabled selected hidden>Escoge un ejercicio</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
          <svg class="w-4 h-4 text-gray-500 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>
      <div id="previewWrapper" class="col-span-full hidden">
        <div id="videoPreview" class="w-full h-64 rounded-lg overflow-hidden"></div>
      </div>

      <!-- Detalles del entrenamiento -->
      <div class="col-span-full">
        <h3 class="text-lg font-bold mb-2 border-b border-gray-300 dark:border-gray-700 pb-1">Detalles del entrenamiento</h3>
      </div>

      <input id="series" type="number" name="series" required min="1" title="Número de series del ejercicio" placeholder="Series" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent text-black text-opacity-90 dark:text-white dark:text-opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none" />
      <input id="reps" type="number" name="reps" required min="1" title="Repeticiones por serie" placeholder="Reps" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent text-black text-opacity-90 dark:text-white dark:text-opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none" />
      <input id="carga" type="number" name="carga" title="Peso utilizado en kg" placeholder="Carga (kg)" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent text-black text-opacity-90 dark:text-white dark:text-opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none" />
      <input id="RPE" type="number" name="rpe" min="1" max="10" title="Percepción del esfuerzo" placeholder="RPE (1-10)" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent text-black text-opacity-90 dark:text-white dark:text-opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none" />

      <!-- Notas -->
      <div class="col-span-full">
        <h3 class="text-lg font-bold mb-2 border-b border-gray-300 dark:border-gray-700 pb-1">Notas</h3>
      </div>

      <input id="nota" type="text" name="nota" placeholder="Ej. subir peso progresivamente" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-transparent text-black text-opacity-90 dark:text-white dark:text-opacity-90 focus:outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none col-span-full" />

      <!-- Botón añadir -->
      <button type="submit" class="col-span-full bg-blue-600 text-white font-semibold rounded py-2 hover:bg-blue-700 transition">
        <span id="btnText">Añadir bloque</span>
        <svg id="btnSpinner" class="w-4 h-4 ml-2 animate-spin hidden inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
      </button>
    </form>

    <!-- Lista de bloques -->
    <section id="listaRutina" class="space-y-6 border-t pt-6" data-aos="fade-up"></section>

    <!-- Mensaje de feedback -->
    <div id="mensaje" class="fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded shadow hidden z-50"></div>

    <!-- Acciones -->
    <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8 bg-white dark:bg-black p-4 fixed bottom-0 left-0 right-0 z-50 border-t border-gray-200 dark:border-gray-700" data-aos="fade-up">
      <button onclick="exportarPDF()" class="bg-black text-white px-6 py-2 rounded hover:bg-gray-800 transition">
        Exportar PDF
      </button>
      <button onclick="limpiarRutina()" class="border border-red-500 text-red-500 px-6 py-2 rounded hover:bg-red-600 hover:text-white transition">
        Borrar todo
      </button>
    </div>

    </main>
  </div>

  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Script funcional -->
  <script>
    let ejercicios = [];

    async function obtenerEjercicios() {
      try {
        const res = await fetch('http://localhost:5100/api/ejercicios');
        const data = await res.json();
        ejercicios = data;
        const ejSelect = document.getElementById('ejercicio');
        ejercicios.forEach(ej => {
          ejSelect.innerHTML += `<option value="${ej.nombre}">${ej.nombre}</option>`;
        });
      } catch (error) {
        console.error('Error al cargar ejercicios:', error);
      }
    }
    const videoPreview = document.getElementById('videoPreview');
    const ejSelect = document.getElementById('ejercicio');
    const previewWrapper = document.getElementById('previewWrapper');

    function obtenerEjercicioInterno(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes('sentadilla')) return 'squat';
      if (n.includes('press')) return 'bench';
      if (n.includes('muerto')) return 'deadlift';
      return 'squat';
    }

    ejSelect.addEventListener('change', () => {
      const ejercicioSeleccionado = ejercicios.find(ej => ej.nombre === ejSelect.value);
      if (ejercicioSeleccionado && ejercicioSeleccionado.videoUrl) {
        const videoIdMatch = ejercicioSeleccionado.videoUrl.match(/(?:v=|\/)([a-zA-Z0-9_-]{11})/);
        const videoId = videoIdMatch ? videoIdMatch[1] : null;

        if (videoId) {
          videoPreview.innerHTML = `
            <iframe 
              class="w-full h-full rounded-lg" 
              src="https://www.youtube.com/embed/${videoId}" 
              title="Video de ${ejercicioSeleccionado.nombre}" 
              frameborder="0" allowfullscreen
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            ></iframe>
          `;
          previewWrapper.classList.remove('hidden');
        } else {
          videoPreview.innerHTML = '';
          previewWrapper.classList.add('hidden');
        }
      } else {
        videoPreview.innerHTML = '';
        previewWrapper.classList.add('hidden');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const ejSelect = document.getElementById('ejercicio');
      obtenerEjercicios();
      for (let i = 1; i <= 10; i++) {
        document.getElementById('rpe').innerHTML += `<option value="${i}">${i}</option>`;
      }
      cargarDesdeLocalStorage();
    });

    const form = document.getElementById('formRutina');
    const lista = document.getElementById('listaRutina');

    let intentoEnvio = false;

    form.addEventListener('submit', e => {
      e.preventDefault();
      intentoEnvio = true;

      // Validar campos requeridos
      const campos = form.querySelectorAll('select[required], input[required]');
      let valido = true;
      campos.forEach(campo => {
        if (!campo.value) {
          campo.classList.add('invalid-campo');
          valido = false;
        } else {
          campo.classList.remove('invalid-campo');
        }
      });

      if (!valido) return;

      // Si pasa validación, continuar con agregar bloque
      const btn = form.querySelector('button[type="submit"]');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      btn.disabled = true;
      btnText.textContent = 'Añadiendo...';
      btnSpinner.classList.remove('hidden');

      const data = new FormData(form);
      const dia = data.get('dia');
      const ejercicio = data.get('ejercicio');
      const series = +data.get('series');
      const reps = +data.get('reps');
      const carga = +data.get('carga') || 0;
      const rpe = data.get('rpe') || '-';
      const nota = data.get('nota') || '';

      // Ya no se calcula ni muestra volumen total

      const contenedorDia = document.getElementById('dia-' + dia) || crearSeccionDia(dia);
      const bloque = document.createElement('div');
      bloque.className = 'bloque relative border rounded-lg p-4 shadow-md bg-gray-100 dark:bg-gray-800';
      bloque.setAttribute('data-aos', 'fade-up');
      bloque.innerHTML = `
        <button class="absolute top-2 right-2 text-red-500 hover:text-red-700 text-sm" onclick="eliminarBloque(this)">✖</button>
        <p class="font-semibold">${ejercicio}</p>
        <p>${series} x ${reps} — ${carga || '-'} kg @ RPE ${rpe}</p>
        ${nota ? `<p class="text-sm text-gray-500">${nota}</p>` : ''}
      `;

      contenedorDia.querySelector('.bloques').appendChild(bloque);
      guardarEnLocalStorage();

      btn.disabled = false;
      btnText.textContent = 'Añadir bloque';
      btnSpinner.classList.add('hidden');

      form.reset();

      mostrarMensaje('Bloque añadido correctamente ✅');
    });

    function crearSeccionDia(dia) {
      const seccion = document.createElement('div');
      seccion.id = 'dia-' + dia;
      seccion.className = 'space-y-3';
      seccion.innerHTML = `<h2 class="text-xl font-bold mt-6">${dia}</h2><div class="bloques space-y-3"></div>`;
      lista.appendChild(seccion);
      new Sortable(seccion.querySelector('.bloques'), { animation: 150 });
      return seccion;
    }

    function eliminarBloque(btn) {
      btn.parentElement.remove();
      guardarEnLocalStorage();
    }

    function limpiarRutina() {
      lista.innerHTML = '';
      localStorage.removeItem('rutinaHTML');
    }

    function exportarPDF() {
      const contenido = document.createElement('div');
      contenido.innerHTML = `<h1 style="font-family: Montserrat; font-size: 24px; font-weight: bold; margin-bottom: 20px;">Rutina GSFIT</h1>` +
                            lista.innerHTML;
                            // Se eliminó la línea que añadía volumen total
      html2pdf().from(contenido).set({
        margin: 0.5,
        filename: 'rutina_gsfit.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      }).save();
    }

    function guardarEnLocalStorage() {
      localStorage.setItem('rutinaHTML', lista.innerHTML);
      // Se eliminó la línea que guardaba volumenTotal
    }

    function cargarDesdeLocalStorage() {
      if (localStorage.getItem('rutinaHTML')) {
        lista.innerHTML = localStorage.getItem('rutinaHTML');
        // Se eliminó la recuperación de volumenTotal
        document.querySelectorAll('.bloques').forEach(b => new Sortable(b, { animation: 150 }));
      }
    }

    function mostrarMensaje(msg) {
      const m = document.getElementById('mensaje');
      m.textContent = msg;
      m.classList.remove('hidden');
      setTimeout(() => m.classList.add('hidden'), 3000);
    }
</script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

</body>
</html>
